name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Merge Dependabot PR(s)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running manual batch merge for all open Dependabot PRs..."
            prs=$(gh pr list --json number,author,url --jq '.[] | select(.author.login=="dependabot[bot]" or .author.login=="app/dependabot") | .url')
            if [ -z "$prs" ]; then
              echo "No open Dependabot PRs found."
            else
              for url in $prs; do
                echo "Merging $url..."
                gh pr merge --squash "$url" || echo "Failed to merge $url"
              done
            fi
          else
            echo "Merging PR ${{ github.event.pull_request.html_url }}..."
            gh pr merge --squash "${{ github.event.pull_request.html_url }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
